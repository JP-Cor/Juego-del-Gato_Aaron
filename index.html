<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#101827">
    <title>Juego de Gato | Dos jugadores</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="app">
        <header><span class="eyebrow">Aaron 100 juegos</span>
            <h1>🐱 Juego de Gato</h1>
            <p>Dos jugadores · Un mismo dispositivo</p>
        </header>
        <section id="setup" class="card">
            <h2>¿Quiénes van a jugar?</h2><label for="nameX">Jugador X</label><input id="nameX" maxlength="24"
                placeholder="Nombre del jugador X" autocomplete="off"><label for="nameO">Jugador O</label><input
                id="nameO" maxlength="24" placeholder="Nombre del jugador O" autocomplete="off"><label
                class="checkbox"><input type="checkbox" id="trackScore" checked> Llevar conteo de partidas y
                victorias</label><button id="start" class="primary">Comenzar partida</button><button id="skip"
                class="secondary">Omitir nombres</button>
        </section>
        <section id="game" class="hidden">
            <div id="scorePanel" class="score card">
                <div><small id="labelX">Jugador X</small><strong id="scoreX">0</strong></div>
                <div><small>Empates</small><strong id="draws">0</strong></div>
                <div><small id="labelO">Jugador O</small><strong id="scoreO">0</strong></div>
            </div>
            <div class="meta"><span id="status" role="status" aria-live="polite"></span><span id="played">Partidas
                    jugadas: 0</span></div>
            <div id="board" class="board" aria-label="Tablero de gato"></div>
            <div class="actions"><button id="next" class="primary">Nueva partida</button><button id="reset"
                    class="secondary">Reiniciar juego y cambiar nombres</button></div>
        </section>
        <footer>Juego de Gato · Versión GitHub Pages</footer>
    </main>
    <dialog id="confirm">
        <h2>¿Reiniciar todo?</h2>
        <p>Se borrarán los nombres y el marcador de este navegador.</p>
        <div class="actions"><button id="cancel" class="secondary">Cancelar</button><button id="accept"
                class="danger">Sí, reiniciar</button></div>
    </dialog>
    <script src="script.js"></script>
</body>

</html>
